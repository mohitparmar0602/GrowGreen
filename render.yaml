services:
  - type: web
    name: growgreen-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        placeholder: "Enter your MongoDB Atlas URI here"
      - key: CLIENT_URL
        placeholder: "Enter your deployed frontend URL (e.g., https://growgreen.onrender.com)"
      - key: JWT_SECRET
        generateValue: true
